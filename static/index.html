<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoApply — Autonomous Multi-Agent Job Application Studio</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta name="description" content="Agentic AI assistant for job applications powered by Google ADK, FastAPI, and Typst ATS Resume Engine.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    // HOTFIX: guard when Tailwind CDN offline — boot must not die on tailwind.config.
    if (window.tailwind) {
      tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            }
          }
        }
      }
    };
  }
  </script>

  <!-- Custom Design Tokens & Stylesheet -->
  <link rel="stylesheet" href="/static/css/app.css">

  <!-- Dark Mode Init Script (Prevents flash) -->
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Top Sticky Navigation Bar -->
  <header id="main-navbar" class="sticky top-0 z-40 glass-nav"></header>

  <!-- Main SPA Root Container -->
  <noscript><div style="padding:16px;text-align:center">AutoApply needs JavaScript enabled.</div></noscript>
  <main id="app-root" class="flex-1 pb-16">
    <!-- Initial Loading Skeleton -->
    <div class="max-w-7xl mx-auto px-4 py-16 flex flex-col items-center justify-center space-y-4">
      <div class="spinner text-indigo-600"></div>
      <p class="text-xs text-slate-400 font-mono tracking-wider">BOOTING AUTOAPPLY STUDIO...</p>
    </div>
  </main>

  <!-- Auth Modal Root -->
  <div id="auth-modal-root"></div>

  <!-- Global Footer -->
  <footer class="border-t border-slate-200 dark:border-slate-800/80 bg-white/40 dark:bg-slate-900/40 py-6 text-center text-xs text-slate-500 dark:text-slate-400">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span class="font-medium text-slate-700 dark:text-slate-300">AutoApply v1.0 ADK</span>
        <span>•</span>
        <span>FastAPI + Typst Engine</span>
      </div>
      <div class="flex items-center space-x-4">
        <a href="/docs" target="_blank" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">API Docs</a>
        <a href="#/settings" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">System Diagnostics</a>
      </div>
    </div>
  </footer>

  <!-- App Bootstrap JS (ES Module) -->
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
